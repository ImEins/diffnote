services:
  api:
    container_name: diffnote-api
    build: .
    ports:
      - "${API_PORT}:${API_PORT}"
    user: vscode
    command: sleep infinity
    volumes:
      - diffnote-api-data:/workspaces/diffnote
      - ./:/workspaces/diffnote:cached
    networks:
      - diffnote-network

  frontend:
    container_name: diffnote-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - diffnote-network
    depends_on:
      - api

  db:
    container_name: diffnote-postgres
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - diffnote-db-data:/var/lib/postgresql/data
    networks:
      - diffnote-network

networks:
  diffnote-network:
    driver: bridge

volumes:
  diffnote-db-data:
  diffnote-api-data:
