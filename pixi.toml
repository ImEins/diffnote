[project]
name = "diffnote"
version = "0.1.0"
description = "A FastAPI-based REST API for a versioned note-taking app."
authors = ["ImEins <mehdi.ramtakh@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-aarch64"]

[tasks]
dev = "uvicorn src.main:app --reload --port 8000 --host 0.0.0.0"
serve = "uvicorn src.main:app"
test = "pytest -v"

[environments]
default = { features = ["dev"], solve-group = "prod" }
prod = { features = [], solve-group = "prod" }

[dependencies]
python = ">=3.11"
fastapi = ">=0.115.11,<0.116"
sqlmodel = ">=0.0.24,<0.0.25"
mypy = ">=1.15.0,<2"
loguru = ">=0.7.2,<0.8"
asyncpg = ">=0.30.0,<0.31"
alembic = ">=1.15.1,<2"
psycopg2 = ">=2.9.9,<3"

[pypi-dependencies]
pydantic-settings = ">=2.8.1,<3"
fastapi-pagination = ">=0.12.34,<0.13"

[feature.dev.pypi-dependencies]
ruff = "*"
pytest = "*"
pytest-asyncio = "*"
